name: Minutes restantes
on:
  schedule:
    - cron: "7 * * * *"   # chaque heure
  workflow_dispatch:
permissions:
  contents: write
concurrency: minutes
jobs:
  lire:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Lire les minutes du compte
        env:
          GH_FACTURATION: ${{ secrets.GH_FACTURATION }}
          GH_BUDGET_ACTIONS: ${{ vars.GH_BUDGET_ACTIONS }}
        run: |
          python3 minutes_compte.py > sortie.txt || { cat sortie.txt; exit 1; }
          cat sortie.txt
          date -u +"%Y-%m-%dT%H:%MZ" >> sortie.txt
          mv sortie.txt minutes.txt
      - name: Enregistrer
        run: |
          git config user.name "compteur"; git config user.email "compteur@users.noreply.github.com"
          git add minutes.txt
          git diff --cached --quiet || git commit -m "minutes" && git push
